name: Publish the website

# The website is rebuilt when a tag is pushed, and at no other time. A push to any
# branch, main included, changes nothing anyone can see.
#
# That is enforced by GitHub rather than by this file. The `github-pages` environment
# below only accepts a deployment whose ref it has been told to allow, so a push to a
# branch cannot deploy even if someone changes what is written here. A paths list would
# have been a rule anyone could widen by accident.
#
# Two one-time repository settings this depends on:
#
#   Settings -> Pages -> Build and deployment -> Source: "GitHub Actions"
#
#     It cannot be "Deploy from a branch": dist/ is build output and is not in the
#     repository, so no branch holds a finished page to serve.
#
#   Settings -> Environments -> github-pages -> Deployment branches and tags
#
#     Must allow the tag pattern v*, and the branch main for a manual run. On
#     2026-09-20 this repository refused a deployment from v0.0.1 until it did:
#     `Tag "v0.0.1" is not allowed to deploy to github-pages due to environment
#     protection rules`. Nothing in this file can work around that, by design.
#
# workflow_dispatch republishes whatever it is run against, for when a deployment failed
# for a reason outside the repository.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and never cancel one halfway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: The tag and VERSION must say the same thing
        if: github.ref_type == 'tag'
        run: |
          set -euo pipefail
          declared="$(tr -d '[:space:]' < VERSION)"
          tagged="${GITHUB_REF_NAME#v}"
          if [ "$tagged" != "$declared" ]; then
            echo "the site would carry v$declared while the tag says $GITHUB_REF_NAME" >&2
            exit 1
          fi
          echo "  ok  both say $declared"

      - name: Build
        run: |
          set -euo pipefail
          python3 build.py
          ls -l dist/

      - name: The page carries the version it was built from
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          grep -q ">v${version}<" dist/index.html || {
            echo "the built page does not show v${version}" >&2; exit 1; }
          echo "  ok  the page shows v${version}"

      # Fails early and clearly if Pages is not enabled.
      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
