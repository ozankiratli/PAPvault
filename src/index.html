<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PAPvault</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%232f6fde'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<noscript><p class="notice">PAPvault needs JavaScript to read your data in this browser.</p></noscript>
<div id="app" hidden>
  <header class="topbar">
    <h1 class="brand">PAPvault</h1>
    <div class="controls">
      <button type="button" id="date-control" disabled>Date</button>
      <button type="button" id="time-control" disabled>Time</button>
      <button type="button" id="theme-toggle">Dark mode</button>
    </div>
  </header>
  <main>
    <p class="empty">No data loaded.</p>
  </main>
  <footer>
    <a href="https://github.com/ozankiratli/PAPvault" rel="noreferrer">Source code</a>
  </footer>
</div>
<script src="app.js"></script>
</body>
</html>
